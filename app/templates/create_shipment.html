{% extends "base.html" %}
{% block content %}

<div class="mx-auto page-animate" style="max-width:900px;">
  <div class="card-custom p-4 p-md-5">

    <h3 class="fw-bold mb-4 text-dark text-center">Create Shipment</h3>

    {% if flash %}
    <div class="alert alert-info text-center fw-semibold rounded-3">{{ flash }}</div>
    {% endif %}



    <form method="POST" class="row g-4">

      <!-- Shipment ID -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Shipment ID</label>
        <input name="shipment_id" class="form-control p-3" required>
      </div>

      <!-- Weight -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Weight (kg)</label>
        <input name="weight" type="number" step="0.01" class="form-control p-3" required>
      </div>

      <!-- Sender Name -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Sender Name</label>
        <input name="sender_name" class="form-control p-3"
        value="{{ user_name }}" {% if not is_admin %}readonly{% endif %} required>
      </div>

      <!-- Receiver Name -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Receiver Name</label>
        <input name="receiver_name" class="form-control p-3" required>
      </div>

      <!-- Sender Email -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Sender Email</label>

        {% if is_admin %}
        <input type="email" name="sender_email" class="form-control p-3" required>
        {% else %}
        <input type="email" name="sender_email" class="form-control p-3"
               value="{{ user_email }}" readonly required>
        {% endif %}
      </div>

      <!-- Receiver Email -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Receiver Email</label>
        <input type="email" name="receiver_email" class="form-control p-3" required>
      </div>

      <!-- Initial Location -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Initial Location</label>
        <input name="initial_location" class="form-control p-3" required>
      </div>

      <!-- Destination -->
      <div class="col-md-6">
        <label class="form-label fw-semibold">Destination</label>
        <input name="destination" class="form-control p-3" required>
      </div>

      {% if is_admin %}
      <!-- Admin Status Select -->
      <div class="col-12">
        <label class="form-label fw-semibold">Shipment Status</label>
        <select name="status" class="form-select p-3">
          <option value="Pending">Pending</option>
          <option value="In Transit">In Transit</option>
          <option value="Delivered">Delivered</option>
        </select>
      </div>
      {% else %}
      <!-- Hidden fixed Status -->
      <input type="hidden" name="status" value="Pending">
      {% endif %}

      <!-- Submit -->
      <div class="col-12">
        <button class="btn btn-dark w-100 py-3 rounded-3">Create Shipment</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
