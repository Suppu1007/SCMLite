<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | SCMLite</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root { --bg-soft:#f6e7d3; --card-bg:#fff; --text-dark:#5a4636; --text-light:#8a7b70; }
body {
  margin:0; background:var(--bg-soft);
  display:flex; justify-content:center; align-items:center;
  font-family:"Inter",sans-serif; min-height:100vh;
}
.wrapper {
  width:420px; background:var(--card-bg); padding:45px;
  border-radius:22px; box-shadow:0 15px 45px rgba(0,0,0,.12);
  text-align:center;
}
.title { font-size:1.7rem; font-weight:900; color:var(--text-dark); margin-bottom:22px; }
.form-control {
  height:48px; border-radius:10px; border:1px solid #d3c7bb;
}
.btn-submit {
  width:100%; margin-top:12px; background:var(--text-dark);
  color:#fff; border:none; border-radius:50px; padding:12px;
  transition:0.3s;
}
.btn-submit:hover { background:#3d3025; transform:translateY(-3px); }
.link-area { margin-top:18px; font-size:.9rem; }
.toast-container { position:fixed; top:12px; right:12px; z-index:9999; }
</style>
</head>

<body>

<div class="toast-container">
  <div id="flashToast" class="toast text-bg-danger border-0">
    <div class="toast-body" id="flashMessage"></div>
  </div>
</div>

<div class="wrapper">
  <div class="title">Forgot Password</div>

  <form method="POST" action="/forgot-password">
    <input type="email" name="email" class="form-control mb-3" placeholder="Enter your account email" required>
    <button class="btn-submit">Send Reset Link</button>
  </form>

  <div class="link-area">
    <a href="/login">Back to Login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const cookie = document.cookie.split("; ").find(row => row.startsWith("flash="));
    if (cookie) {
        const msg = decodeURIComponent(cookie.split("=")[1]);
        flashToast(msg);
        document.cookie = "flash=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    }
});

function flashToast(message) {
    document.getElementById("flashMessage").textContent = message;
    new bootstrap.Toast(document.getElementById("flashToast")).show();
}
</script>

</body>
</html>
